aid: gptzero
name: GPTZero
description: 'GPTZero is an AI content detection company whose v2 API analyzes text
  and uploaded documents to determine whether content was written by a human, by AI,
  or is a mix of both. The API returns document-, paragraph-, and sentence-level probabilities
  along with supporting perplexity and burstiness signals, plus asynchronous batch
  analysis and aggregate reporting. Authentication is via an X-API-Key header, requests
  are rate limited to 30,000 per hour, and API access is bundled with the Professional
  plan. GPTZero was surfaced as a portfolio company of Uncork Capital and has been
  enriched into the API Evangelist network from its public developer surface.'
